name: KernelSU integration
description: Integrate KernelSU-Next without compiling the kernel.
runs:
  using: composite
  steps:
    - name: 🧩 Prepare KernelSU
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        REPO="${KSU_REPO:-https://github.com/KernelSU-Next/KernelSU-Next.git}"
        BRANCH="${KSU_BRANCH:-legacy}"

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🧩 KernelSU integration"
        echo "Repository: ${REPO}"
        echo "Branch    : ${BRANCH}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        rm -rf KernelSU
        git clone --depth=1 --filter=blob:none --single-branch -b "$BRANCH" "$REPO" KernelSU

        # Official non-GKI revision containing the 3.4.2 backports.
        if [[ "$REPO" == "https://github.com/KernelSU-Next/KernelSU-Next.git" && "$BRANCH" == "legacy" ]]; then
          REV="0b17f24246db5c80c056b92c15bcad2b77f1276e"
          git -C KernelSU fetch --depth=1 origin "$REV"
          git -C KernelSU checkout --detach "$REV"
        fi
        if [[ "${HOOK_TYPE:-syscall-table}" == "syscall-table" ]] &&
           ! grep -q '^config KSU_SYSCALL_TABLE_HOOK$' KernelSU/kernel/Kconfig; then
          echo "::error::Selected KernelSU revision does not support syscall-table"
          exit 1
        fi

        ln -sfn ../KernelSU/kernel drivers/kernelsu
        grep -q 'CONFIG_KSU.*kernelsu/' drivers/Makefile ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig ||
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        git -C KernelSU log -1 --format='KernelSU revision: %H %s'

        echo "✅ KernelSU integration finished"
        echo "ℹ️  This step intentionally does not run make."
