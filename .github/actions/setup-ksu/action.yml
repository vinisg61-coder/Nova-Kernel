name: KernelSU integration
description: Integrate KernelSU-Next without compiling the kernel.
runs:
  using: composite
  steps:
    - name: 🧩 Prepare KernelSU
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        REPO="${KSU_REPO:-https://github.com/KernelSU-Next/KernelSU-Next.git}"
        BRANCH="${KSU_BRANCH:-v3.4.2}"

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🧩 KernelSU integration"
        echo "Repository: ${REPO}"
        echo "Branch    : ${BRANCH}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        rm -rf KernelSU
        git clone --depth=1 --filter=blob:none --single-branch -b "$BRANCH" "$REPO" KernelSU

        if [[ "$REPO" == "https://github.com/KernelSU-Next/KernelSU-Next.git" && "$BRANCH" == "v3.4.2" ]]; then
          test "$(git -C KernelSU rev-parse HEAD)" = 4c706b5938665866ebe16944a481a7b91e3396af
          if [[ "${HOOK_TYPE:-builtin}" != "builtin" ]]; then
            echo "::error::Official v3.4.2 uses its built-in hooks; select hook_type=builtin"
            exit 1
          fi
          # Backport the policy APIs needed by the complete 3.4.2 implementation.
          git apply --check .github/patches/selinux-510-policy.patch
          git apply .github/patches/selinux-510-policy.patch
          git -C KernelSU apply --check "$GITHUB_WORKSPACE/.github/patches/ksu-v3.4.2-linux54.patch"
          git -C KernelSU apply "$GITHUB_WORKSPACE/.github/patches/ksu-v3.4.2-linux54.patch"
          sha256sum .github/patches/selinux-510-policy.patch .github/patches/ksu-v3.4.2-linux54.patch
        fi
        if [[ "${HOOK_TYPE:-builtin}" == "syscall-table" ]] &&
           ! grep -q '^config KSU_SYSCALL_TABLE_HOOK$' KernelSU/kernel/Kconfig; then
          echo "::error::Selected KernelSU revision does not support syscall-table"
          exit 1
        fi

        ln -sfn ../KernelSU/kernel drivers/kernelsu
        grep -q 'CONFIG_KSU.*kernelsu/' drivers/Makefile ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig ||
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        git -C KernelSU log -1 --format='KernelSU revision: %H %s'

        echo "✅ KernelSU integration finished"
        echo "ℹ️  This step intentionally does not run make."
